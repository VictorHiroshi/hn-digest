[project]
name = "hn-digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VictorHiroshi", email = "victor_hiroshi@hotmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.3",
]

[project.scripts]
hn-digest = "hn_digest:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".direnv",
    ".git",
    ".git-rewrite",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
]

line-length = 120
indent-width = 4

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
